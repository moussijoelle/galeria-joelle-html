<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metamorfosis: La Galería de una Vela</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/jpeg" href="img/imagelogo.jpg" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="cuerpo"></div>

    <script src="posts.js"></script>
    <script type="text/babel">
      function PostCard({ post }) {
        return (
          <article className="bg-stone-900/80 backdrop-blur-sm text-amber-50 rounded-xl p-4 w-96 border border-amber-800/40 shadow-xl">
            <img
              src={post.image}
              alt={post.title}
              className="w-full h-52 object-cover object-center rounded-lg"
            />
            <h2 className="font-bold mt-3">{post.title}</h2>
            <p className="line-clamp-3 text-sm mt-2">{post.description}</p>
            <p className="line-clamp-3 text-sm mt-2">{post.content}</p>
            <p className="text-amber-200/70 text-sm mt-3">{post.created_at}</p>
          </article>
        );
      }

      function App() {
        return (
          <div
            className="min-h-screen p-8 bg-cover bg-center bg-fixed"
            style={{ backgroundImage: "url('img/bgdelavela.jpg')" }}
          >
            <h1
              className="text-center text-3xl mb-6 tracking-normal text-white"
              style={{ fontFamily: "'Cormorant Garamond', serif" }}
            >
              Metamorfosis: La Galería de una Vela
            </h1>
            <div className="flex flex-wrap justify-center gap-4">
              {postsData.map((post) => (
                <PostCard key={post.id} post={post} />
              ))}
            </div>
          </div>
        );
      }

      const container = document.getElementById("cuerpo");
      const cuerpo = ReactDOM.createRoot(container);
      cuerpo.render(<App />);
    </script>
  </body>
</html>
